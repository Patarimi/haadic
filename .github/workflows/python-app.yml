
# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  python-version: "3.12"

permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          args: 'check'        
      - uses: astral-sh/ruff-action@v3
        with:
          args: 'format --check'

  doc-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}
          cache: 'pip'
      - run: |
          pip install --upgrade pip
          uv sync --only-group doc
      - name: Build Doc
        run: |
          uv run mkdocs build

  testing:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    needs: [check-format, doc-build]

    steps:
    - name: Restore PDK Directory
      id: pdk-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          pdk/
        key: ${{ runner.os }}-pdk-${{ hashFiles('**/hades/techno.yml') }}
    - uses: actions/checkout@v5
    - name: Install Nix for Ubuntu
      if: ${{runner.os != 'Windows' }}
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-24.11
    - name: Config Ubuntu - Setup External Tools
      if: ${{runner.os != 'Windows' }}
      run: |
        nix-channel --update
        nix-channel --list
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.python-version }}
    - name: Install Dependencies
      run: |
        uv tree
        uv sync --group dev
    - name: Install PDK
      run: |
        uv run hades pdk install sky130
        uv run hades pdk install gf180mcu
    - name: Install PDK - Windows
      if: ${{runner.os == 'Windows' }}
      run: |
        uv run volare enable --pdk sky130 --pdk-root ./pdk 6d4d11780c40b20ee63cc98e645307a9bf2b2ab8
        uv run volare enable --pdk gf180mcu --pdk-root ./pdk 6d4d11780c40b20ee63cc98e645307a9bf2b2ab8
        uv run volare ls
    - if: ${{ steps.pdk-restore.outputs.cache-hit != 'true' }}
      name: Save PDK Directory
      id: pdk-save
      uses: actions/cache/save@v4
      with:
        path: |
          pdk/
        key: ${{ steps.pdk-restore.outputs.cache-primary-key }}
    - name: Test with Pytest
      run: |
        uv run pytest -rxXs --basetemp=tmp
    - name: Store reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: reports-${{ matrix.os }}
        path: |
          tmp/
          pytest.log
